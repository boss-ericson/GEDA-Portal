<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="wallGradSec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="woodDesk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="50%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Wall & Floor -->
  <rect width="1200" height="520" fill="url(#wallGradSec)"/>
  <rect y="520" width="1200" height="280" fill="#78350F" opacity="0.85"/>
  <line x1="0" y1="520" x2="1200" y2="520" stroke="#451A03" stroke-width="4"/>

  <!-- Green Noticeboard / Chalkboard in Background -->
  <g transform="translate(480, 50)" filter="url(#shadow2)">
    <rect x="0" y="0" width="660" height="260" fill="#15803D" rx="6" stroke="#166534" stroke-width="6"/>
    <!-- Grid/Charts on Chalkboard -->
    <rect x="30" y="30" width="120" height="180" fill="#FFFFFF" opacity="0.9" rx="3"/>
    <text x="90" y="50" font-family="sans-serif" font-weight="bold" font-size="10" fill="#15803D" text-anchor="middle">ACADEMIC CHART</text>
    <line x1="40" y1="65" x2="140" y2="65" stroke="#166534" stroke-width="2"/>
    <rect x="50" y="100" width="15" height="90" fill="#22C55E"/>
    <rect x="75" y="80" width="15" height="110" fill="#3B82F6"/>
    <rect x="100" y="120" width="15" height="70" fill="#EAB308"/>

    <!-- Additional Posters on Board -->
    <rect x="180" y="30" width="100" height="85" fill="#FEF3C7" rx="3"/>
    <text x="230" y="50" font-family="sans-serif" font-weight="bold" font-size="9" fill="#92400E" text-anchor="middle">BECE / WASSCE</text>
    <text x="230" y="70" font-family="sans-serif" font-size="8" fill="#1E293B" text-anchor="middle">INDEX &amp; SUBJECTS</text>

    <rect x="180" y="125" width="100" height="85" fill="#E0F2FE" rx="3"/>
    <text x="230" y="145" font-family="sans-serif" font-weight="bold" font-size="9" fill="#0369A1" text-anchor="middle">TIME TABLE</text>
    <line x1="190" y1="155" x2="270" y2="155" stroke="#0284C7" stroke-width="1"/>
    <line x1="190" y1="170" x2="270" y2="170" stroke="#0284C7" stroke-width="1"/>
    <line x1="190" y1="185" x2="270" y2="185" stroke="#0284C7" stroke-width="1"/>

    <rect x="300" y="30" width="140" height="180" fill="#3B82F6" opacity="0.9" rx="3"/>
    <text x="370" y="55" font-family="sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF" text-anchor="middle">EXAM RULES</text>
    <text x="370" y="85" font-family="sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle">1. SILENCE IN HALL</text>
    <text x="370" y="110" font-family="sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle">2. USE BLUE BALL PEN</text>
    <text x="370" y="135" font-family="sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle">3. VERIFY INDEX NO.</text>
    <text x="370" y="160" font-family="sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle">4. DO YOUR BEST</text>

    <rect x="460" y="30" width="160" height="180" fill="#1E293B" rx="3"/>
    <text x="540" y="55" font-family="sans-serif" font-weight="bold" font-size="11" fill="#FACC15" text-anchor="middle">GES CURRICULUM</text>
    <circle cx="540" cy="115" r="35" fill="none" stroke="#22C55E" stroke-width="3"/>
    <text x="540" y="120" font-family="sans-serif" font-weight="bold" font-size="10" fill="#FFFFFF" text-anchor="middle">100% PASS</text>
  </g>

  <!-- Students at Wooden Desks -->

  <!-- Secondary Students Background Left -->
  <g transform="translate(60, 320)">
    <rect x="0" y="60" width="300" height="140" fill="url(#woodDesk)" rx="6"/>
    <circle cx="150" cy="10" r="32" fill="#361A05"/>
    <!-- Golden Yellow Shirt -->
    <path d="M100,40 Q150,30 200,40 L210,90 L90,90 Z" fill="#EAB308"/>
    <!-- Pocket Crest GHS -->
    <rect x="165" y="55" width="16" height="20" fill="#1E3A8A" rx="2"/>
    <text x="173" y="68" font-family="sans-serif" font-weight="bold" font-size="6" fill="#FFFFFF" text-anchor="middle">GHS</text>
  </g>

  <!-- Secondary Students Background Right -->
  <g transform="translate(800, 320)">
    <rect x="0" y="60" width="320" height="140" fill="url(#woodDesk)" rx="6"/>
    <circle cx="160" cy="10" r="32" fill="#261203"/>
    <path d="M110,40 Q160,30 210,40 L220,90 L100,90 Z" fill="#EAB308"/>
    <rect x="175" y="55" width="16" height="20" fill="#1E3A8A" rx="2"/>
    <text x="183" y="68" font-family="sans-serif" font-weight="bold" font-size="6" fill="#FFFFFF" text-anchor="middle">GHS</text>
  </g>

  <!-- Main Student in Center Foreground (From Image 2) -->
  <g transform="translate(300, 420)" filter="url(#shadow2)">
    <!-- Wooden Desk -->
    <rect x="0" y="80" width="600" height="220" fill="url(#woodDesk)" rx="8" stroke="#451A03" stroke-width="4"/>
    <!-- Desk legs -->
    <rect x="30" y="300" width="30" height="100" fill="#291102"/>
    <rect x="540" y="300" width="30" height="100" fill="#291102"/>

    <!-- Open Lined Notebook -->
    <rect x="150" y="110" width="300" height="150" fill="#FFFFFF" stroke="#64748B" stroke-width="3" rx="4"/>
    <line x1="300" y1="110" x2="300" y2="260" stroke="#CBD5E1" stroke-width="3"/>

    <!-- Lined Notebook Page details -->
    <line x1="170" y1="135" x2="280" y2="135" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="170" y1="155" x2="280" y2="155" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="170" y1="175" x2="280" y2="175" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="170" y1="195" x2="280" y2="195" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="170" y1="215" x2="280" y2="215" stroke="#94A3B8" stroke-width="1.5"/>

    <line x1="320" y1="135" x2="430" y2="135" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="320" y1="155" x2="430" y2="155" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="320" y1="175" x2="430" y2="175" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="320" y1="195" x2="430" y2="195" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="320" y1="215" x2="430" y2="215" stroke="#94A3B8" stroke-width="1.5"/>

    <!-- Student Figure (JHS/SHS Candidate writing with Blue Pen) -->
    <!-- Hair & Head -->
    <circle cx="300" cy="-30" r="45" fill="#1C1917"/>
    <!-- Dark Skin Tone -->
    <circle cx="300" cy="-15" r="40" fill="#422006"/>
    <!-- Ears -->
    <circle cx="258" cy="-15" r="8" fill="#422006"/>
    <circle cx="342" cy="-15" r="8" fill="#422006"/>

    <!-- Bright Golden Yellow Shirt with Collars -->
    <path d="M220,30 Q300,10 380,30 L410,100 L190,100 Z" fill="#EAB308"/>
    <!-- Collar -->
    <path d="M260,30 L300,60 L280,30 Z" fill="#CA8A04"/>
    <path d="M340,30 L300,60 L320,30 Z" fill="#CA8A04"/>
    
    <!-- Pocket & Crest "GHS" -->
    <rect x="330" y="55" width="22" height="28" fill="#1E3A8A" rx="3"/>
    <path d="M330,55 L341,48 L352,55 Z" fill="#DCEAF6"/>
    <text x="341" y="73" font-family="sans-serif" font-weight="bold" font-size="7" fill="#FFFFFF" text-anchor="middle">GHS</text>

    <!-- Student Arms & Blue Pen -->
    <ellipse cx="230" cy="110" rx="20" ry="12" fill="#422006"/>
    <ellipse cx="370" cy="110" rx="20" ry="12" fill="#422006"/>
    <!-- Blue Ballpoint Pen -->
    <line x1="375" y1="110" x2="330" y2="150" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Overlay Watermark Badge -->
  <g transform="translate(40, 730)">
    <rect x="0" y="0" width="370" height="40" fill="#0B1E2D" opacity="0.9" rx="20"/>
    <text x="20" y="25" font-family="sans-serif" font-weight="bold" font-size="12" fill="#FACC15">GHANA SECONDARY &amp; JHS EXAMINATION ROOM</text>
  </g>
</svg>
